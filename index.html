<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Flash-prevention: apply saved theme before any paint (Requirement 8.5) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('tdl_theme');
        document.documentElement.setAttribute(
          'data-theme',
          saved === 'dark' ? 'dark' : 'light'
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>

  <header class="dashboard-header">
    <button id="theme-toggle" aria-label="Toggle light/dark theme">🌙 Dark Mode</button>
  </header>

  <div class="dashboard-grid">

    <!-- Greeting Widget -->
    <section id="greeting" class="widget">
      <div id="greeting-time"></div>
      <div id="greeting-date"></div>
      <div id="greeting-text"></div>
      <div id="greeting-name-display" style="display:none;"></div>
      <div class="greeting-name-entry">
        <input id="greeting-name-input" type="text" placeholder="Enter your name…" maxlength="50" autocomplete="off">
        <button id="greeting-name-btn" type="button">Save Name</button>
      </div>
      <p id="greeting-name-error" class="error-msg" aria-live="polite"></p>
    </section>

    <!-- Focus Timer Widget -->
    <section id="timer" class="widget">
      <div id="timer-display">25:00</div>
      <div id="timer-notification"></div>
      <div class="timer-controls">
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <button id="timer-reset">Reset</button>
      </div>
    </section>

    <!-- To-Do List Widget -->
    <section id="todo" class="widget">
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="200" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div class="todo-sort">
        <label for="todo-sort-select">Sort by:</label>
        <select id="todo-sort-select">
          <option value="createdAt">Creation Date</option>
          <option value="completion">Completion Status</option>
        </select>
      </div>
      <p id="todo-error" class="error-msg" aria-live="polite"></p>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links Widget -->
    <section id="quick-links" class="widget">
      <form id="links-form">
        <input id="links-label-input" type="text" placeholder="Label" maxlength="50" autocomplete="off">
        <input id="links-url-input" type="text" placeholder="https://example.com" autocomplete="off">
        <button type="submit">Add Link</button>
      </form>
      <p id="links-error" class="error-msg" aria-live="polite"></p>
      <ul id="quick-links-list"></ul>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
